{% extends "base.html" %}{% block page_heading %}Profil{% endblock %}{% block content %}<section class="panel form-panel profile-panel"><div class="profile-avatar">{{ (user.nama or user.username)[0]|upper }}</div><div><h2>{{ user.nama or user.username }}</h2><p class="muted">@{{ user.username }} · {{ user.role|capitalize }}</p></div><form method="post" class="form-grid"><label>Nama<input name="nama" value="{{ user.nama or '' }}" required></label><label>No. HP<input name="no_hp" value="{{ user.no_hp or '' }}"></label><button class="primary-btn" type="submit">Simpan Profil</button></form></section>{% endblock %}
